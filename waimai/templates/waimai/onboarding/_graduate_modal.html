{# 全站：一大步完成后的祝贺窗（须在 base 加载，换页后也能继续下一大步） #}
{% if onboarding_enabled %}
<div id="onboarding-graduate-modal" class="onboarding-modal" hidden>
    <div class="onboarding-backdrop" data-onboarding-close="graduate"></div>
    <div class="onboarding-box card is-graduate" role="dialog" aria-modal="true">
        <div class="onboarding-graduate-icon">🎉</div>
        <h2 class="onboarding-box-title" id="onboarding-graduate-title"></h2>
        <p class="card-meta" id="onboarding-graduate-summary"></p>
        <p class="onboarding-next-hint" id="onboarding-graduate-next" hidden></p>
        <button type="button" class="btn btn-orange btn-block" id="onboarding-graduate-continue">继续下一大步</button>
        <button type="button" class="btn btn-outline btn-block" id="onboarding-graduate-exit">退出体验</button>
    </div>
</div>
{% endif %}
