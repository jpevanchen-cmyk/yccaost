{# 新版新手体验：弹窗（与旧 onboarding-modal 区分，可拖动） #}

<div id="experience-step-picker-modal" class="experience-modal" hidden>
    <div class="experience-backdrop" data-experience-close="picker"></div>
    <div class="experience-box card" role="dialog" aria-modal="true" aria-labelledby="experience-step-picker-title">
        <div class="experience-drag-handle" data-experience-drag-handle>
            <span class="experience-drag-hint">⋮⋮ 可拖动</span>
            <h2 id="experience-step-picker-title" class="experience-box-title">新版体验 · 选大步</h2>
        </div>
        <p class="card-meta" id="experience-step-picker-desc">请选要从哪一大步开始；也可全部从头体验。</p>
        <div id="experience-step-picker-list" class="experience-step-picker-list"></div>
        <div class="experience-zone-actions">
            <button type="button" class="btn btn-orange btn-block" id="experience-step-picker-all">全部从头体验</button>
            <button type="button" class="btn btn-sm btn-outline btn-block" data-experience-close="picker">取消</button>
        </div>
    </div>
</div>

<div id="experience-graduate-modal" class="experience-modal" hidden>
    <div class="experience-backdrop" data-experience-close="graduate"></div>
    <div class="experience-box card is-graduate" role="dialog" aria-modal="true">
        <div class="experience-drag-handle" data-experience-drag-handle>
            <span class="experience-drag-hint">⋮⋮ 可拖动</span>
            <div class="experience-graduate-icon">🎉</div>
            <h2 class="experience-box-title" id="experience-graduate-title"></h2>
        </div>
        <p class="card-meta" id="experience-graduate-summary"></p>
        <p class="experience-next-hint" id="experience-graduate-next" hidden></p>
        <button type="button" class="btn btn-orange btn-block" id="experience-graduate-continue">继续下一大步</button>
        <button type="button" class="btn btn-outline btn-block" id="experience-graduate-exit">退出体验</button>
    </div>
</div>
