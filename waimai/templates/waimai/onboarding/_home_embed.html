{# 服务器主页固定体验入口（H4 v2 · 正本 docs/新手引导流程.md） #}
{% if experience_enabled %}
<section class="showcase-block card experience-zone" id="block-experience" data-yc-tour="block-experience">
    <h2 class="showcase-block-title">🌱 新手体验</h2>
    <div class="showcase-block-main">
        <p class="card-meta">
            快速了解野草开店流程（<strong>6 大步</strong>）；可随时选从哪一步开始，演示数据会自动清理，不真注册。
            演示店：{{ official_shop_name }}。
        </p>
        <p class="msg-err" style="margin:10px 0 0;padding:8px 10px;font-size:13px;line-height:1.45;">
            <strong>设备提示：</strong>建议在<strong>电脑浏览器</strong>上体验；手机小屏说明框可能挡住演示区（改进方案已列入待做）。
        </p>
        <div class="experience-zone-actions">
            <button type="button" class="btn btn-orange" data-experience-start="seller">体验野草开店</button>
        </div>
    </div>
</section>
{% endif %}
