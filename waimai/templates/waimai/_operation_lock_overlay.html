<div id="yc-operation-lock-overlay" class="yc-operation-lock-overlay" role="dialog" aria-modal="true" aria-labelledby="yc-operation-lock-title"
     data-unlock-url="{% url 'operation_lock_unlock' %}"
     data-csrf-token="{{ csrf_token }}">
    <div class="yc-operation-lock-backdrop"></div>
    <div class="yc-operation-lock-panel">
        <h2 id="yc-operation-lock-title" class="page-title">🔒 操作锁</h2>
        <p class="page-desc">店铺管理已锁定。请输入 PIN 继续（不会退出登录）。</p>
        <p class="card-meta">顶部导航与页面内容暂不可操作；工作台、收银、客人点餐不受影响。</p>
        <form class="auth-form yc-operation-lock-form" method="post" action="{% url 'operation_lock_unlock' %}">
            {% csrf_token %}
            <p>
                <label>操作 PIN<br>
                <input type="password" name="pin" autocomplete="off" required autofocus></label>
            </p>
            <p class="yc-operation-lock-error card-meta" style="color:#c0392b;" hidden></p>
            <button type="submit" class="btn btn-green btn-block">解锁</button>
        </form>
    </div>
</div>
