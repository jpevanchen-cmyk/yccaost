{# 全站通用：操作结果弹窗（成功 / 警告 / 错误） #}
{% load static %}
<div id="yc-notice-modal" class="yc-notice-modal" role="alertdialog" aria-modal="true" hidden>
    <div class="yc-notice-backdrop"></div>
    <div class="yc-notice-box is-ok">
        <div class="yc-notice-icon">✅</div>
        <p class="yc-notice-text"></p>
        <button type="button" class="btn btn-block yc-notice-close">知道了</button>
    </div>
</div>
{% if yc_notice_boot %}
<script type="application/json" id="yc-notice-boot">{{ yc_notice_boot|safe }}</script>
{% endif %}
<script src="{% static 'waimai/yc_notice.js' %}?v=2"></script>
